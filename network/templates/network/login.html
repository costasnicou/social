{% extends "network/layout.html" %}
{% block title %}Social Network - Login{% endblock %}

{% block body %}

<main class="main">
    <div class="main-wraper">
        <div class="main-content">
            <div class="loginregister-wraper">
        
                <h2 style="text-align: center;">Login</h2>

                {% if message %}
                    <div>{{ message }}</div>
                {% endif %}

                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <input autofocus class="form-control" type="text" name="username" placeholder="Username">
                    </div>
                    <div class="form-group">
                        <input class="form-control" type="password" name="password" placeholder="Password">
                    </div>
                    <input class="btn btn-primary" type="submit" value="Login">
                </form>
                <p style="margin-top: 15px;">Don't have an account? <a href="{% url 'register' %}">Register here.</a></p>
                
             </div>

         </div>
    </div>
</main>
    
{% endblock %}
